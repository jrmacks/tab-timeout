<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tab Timeout</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #1f2330;
        --muted: #6b7180;
        --accent: #4f46e5;
        --line: #e6e7ee;
        --bg: #ffffff;
      }
      body {
        width: 256px;
        margin: 0;
        padding: 14px 16px;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 12px;
      }
      .top img { border-radius: 7px; }
      .top strong { font-size: 14px; }
      .line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 0;
      }
      .muted { color: var(--muted); }
      a.cog {
        display: block;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      a.cog:hover { text-decoration: underline; }
      /* reuse the options switch styling, scaled down */
      input[type="checkbox"] {
        appearance: none;
        position: relative;
        width: 38px;
        height: 22px;
        border-radius: 999px;
        background: #cdd0db;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      input[type="checkbox"]::after {
        content: "";
        position: absolute;
        top: 2px; left: 2px;
        width: 18px; height: 18px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0,0,0,0.25);
        transition: transform 0.15s ease;
      }
      input[type="checkbox"]:checked { background: var(--accent); }
      input[type="checkbox"]:checked::after { transform: translateX(16px); }
      @media (prefers-color-scheme: dark) {
        :root { --ink:#e8e9ef; --muted:#9aa0b0; --line:#2c2f3a; --bg:#1d2029; }
        input[type="checkbox"] { background:#3a3e4b; }
      }
    </style>
  </head>
  <body>
    <div class="top">
      <img src="../icons/icon48.png" alt="" width="28" height="28" />
      <strong>Tab Timeout</strong>
    </div>

    <div class="line">
      <span>Enabled</span>
      <input type="checkbox" id="enabled" />
    </div>
    <div class="line">
      <span class="muted">Tracked tabs</span>
      <span id="count" class="muted">—</span>
    </div>
    <div class="line">
      <span class="muted">Close after</span>
      <span id="idle" class="muted">—</span>
    </div>

    <a class="cog" id="open-options" href="#">Settings…</a>
    <script type="module" src="popup.js"></script>
  </body>
</html>
